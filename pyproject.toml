[project]
name = "geomusic"
version = "0.1.0"
description = "Python reimplementation of Samantha Shanne's (Geo) Musical Configurations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "platformdirs>=4.3",
  "pillow>=11.0",
  "cairosvg>=2.7",
  "typer>=0.15",
  "rich>=13.9",
]

[project.scripts]
geomusic = "geomusic.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pixelmatch>=0.3",
  "ruff>=0.9",
  "mypy>=1.14",
  "uharfbuzz>=0.55.0",
  "fonttools>=4.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geomusic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "spotify_live: tests that hit the live Spotify API (opt-in, needs credentials)",
]
addopts = "-m 'not spotify_live'"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["EXE001", "UP031"]
"src/geomusic/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
